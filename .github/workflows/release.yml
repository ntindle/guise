name: release

# Build macOS + Windows binaries and attach them to the GitHub Release whenever
# a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The resulting `guise-macos.tar.gz` is what install.sh and the Homebrew formula
# download; `guise-windows-x86_64.zip` is what install.ps1 downloads. Each
# printed `.sha256` is the value to paste into the Homebrew formula
# (see Formula/guise.rb) or to verify a manual download.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Make universal binary + tarball
        run: |
          lipo -create -output guise \
            target/aarch64-apple-darwin/release/guise \
            target/x86_64-apple-darwin/release/guise
          chmod +x guise
          ./guise --version
          tar -czf guise-macos.tar.gz guise
          shasum -a 256 guise-macos.tar.gz | tee guise-macos.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guise-macos
          path: |
            guise-macos.tar.gz
            guise-macos.tar.gz.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (x86_64)
        run: cargo build --release

      - name: Make zip
        run: |
          ./target/release/guise.exe --version
          Compress-Archive -Path ./target/release/guise.exe `
            -DestinationPath guise-windows-x86_64.zip
          (Get-FileHash guise-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() `
            + "  guise-windows-x86_64.zip" |
            Out-File -Encoding ascii guise-windows-x86_64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guise-windows-x86_64
          path: |
            guise-windows-x86_64.zip
            guise-windows-x86_64.zip.sha256

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            guise-macos.tar.gz
            guise-macos.tar.gz.sha256
            guise-windows-x86_64.zip
            guise-windows-x86_64.zip.sha256
          generate_release_notes: true
